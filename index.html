<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Attendance — PACK ONE Launch 2026</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --border: #2a2f3a;
    --text: #e9ebf0;
    --text-dim: #9aa1ae;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --good: #34d399;
    --good-bg: rgba(52, 211, 153, 0.12);
    --warn: #fbbf24;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 20px;
  }

  header.top h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header.top p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 18px 0;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
  }

  .stat .num {
    font-size: 24px;
    font-weight: 700;
  }

  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .stat.checked-in .num { color: var(--good); }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  input[type="text"], input[type="search"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease;
  }

  input[type="text"]:focus, input[type="search"]:focus {
    border-color: var(--accent);
  }

  .filter-btns {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .filter-btns button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }

  .filter-btns button.active {
    background: var(--surface-2);
    color: var(--text);
  }

  .add-btn {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .add-btn:hover { filter: brightness(1.08); }

  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color .15s ease, background .15s ease;
  }

  .row.checked-in {
    border-color: rgba(52, 211, 153, 0.35);
    background: var(--good-bg);
  }

  .row .info { min-width: 0; }

  .row .name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .company {
    font-size: 12.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .badge {
    font-size: 10.5px;
    color: var(--warn);
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .check-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-width: 108px;
    transition: all .15s ease;
  }

  .check-btn.done {
    background: var(--good);
    color: #06281c;
    border-color: var(--good);
  }

  .check-btn:disabled { opacity: 0.6; cursor: wait; }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 14px;
  }

  .loading {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    max-width: 380px;
  }

  .modal h2 {
    margin: 0 0 14px;
    font-size: 17px;
  }

  .modal label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 10px 0 5px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .modal-actions .cancel {
    background: transparent;
    color: var(--text-dim);
  }

  .modal-actions .confirm {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    z-index: 60;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }

  .error-banner {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .error-banner code {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.85;
    word-break: break-all;
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Event Attendance</h1>
    <p>PACK ONE — Launch 2026</p>
  </header>

  <div id="config-error"></div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="stat-total">0</div>
      <div class="label">Registered</div>
    </div>
    <div class="stat checked-in">
      <div class="num" id="stat-checked">0</div>
      <div class="label">Checked in</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-remaining">0</div>
      <div class="label">Remaining</div>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Search by name or company…" autocomplete="off" />
    </div>
    <div class="filter-btns">
      <button data-filter="all" class="active">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="checked">Checked in</button>
    </div>
    <button class="add-btn" id="open-add">+ Add walk-in</button>
  </div>

  <div id="list" class="list">
    <div class="loading">Loading attendee list…</div>
  </div>
</div>

<div id="modal-root"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://myjwzrgujrjdeytzkvhf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_pZWc1olk9-6jCRP0XnV2qw_upR7F8gP';

  const configErrorEl = document.getElementById('config-error');
  let supabase = null;

  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    configErrorEl.innerHTML = `<div class="error-banner">Could not connect to Supabase.<code>${escapeHtml(String(e))}</code></div>`;
  }

  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const statTotal = document.getElementById('stat-total');
  const statChecked = document.getElementById('stat-checked');
  const statRemaining = document.getElementById('stat-remaining');
  const filterBtns = document.querySelectorAll('.filter-btns button');
  const openAddBtn = document.getElementById('open-add');
  const modalRoot = document.getElementById('modal-root');

  let people = [];
  let filter = 'all';
  let query = '';

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  async function loadPeople() {
    const { data, error } = await supabase
      .from('attendance_people')
      .select('*')
      .order('company', { ascending: true })
      .order('name', { ascending: true });

    if (error) {
      listEl.innerHTML = `<div class="error-banner">Failed to load attendees.<code>${escapeHtml(error.message)}</code></div>`;
      return;
    }
    people = data || [];
    render();
  }

  function render() {
    const total = people.length;
    const checked = people.filter(p => p.checked_in).length;
    statTotal.textContent = total;
    statChecked.textContent = checked;
    statRemaining.textContent = total - checked;

    const q = query.trim().toLowerCase();
    let filtered = people.filter(p => {
      if (filter === 'pending' && p.checked_in) return false;
      if (filter === 'checked' && !p.checked_in) return false;
      if (q) {
        const hay = `${p.name} ${p.company || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty">No matching attendees.</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(p => `
      <div class="row ${p.checked_in ? 'checked-in' : ''}" data-id="${p.id}">
        <div class="info">
          <div class="name">${escapeHtml(p.name)}${p.is_walk_in ? '<span class="badge">walk-in</span>' : ''}</div>
          <div class="company">${escapeHtml(p.company || '')}</div>
        </div>
        <button class="check-btn ${p.checked_in ? 'done' : ''}" data-id="${p.id}" data-state="${p.checked_in ? '1' : '0'}">
          ${p.checked_in ? '✓ Checked in' : 'Check in'}
        </button>
      </div>
    `).join('');
  }

  listEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.check-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const currentlyChecked = btn.dataset.state === '1';
    btn.disabled = true;

    const newState = !currentlyChecked;
    const { error } = await supabase
      .from('attendance_people')
      .update({
        checked_in: newState,
        checked_in_at: newState ? new Date().toISOString() : null
      })
      .eq('id', id);

    if (error) {
      showToast('Update failed: ' + error.message);
      btn.disabled = false;
      return;
    }

    const person = people.find(p => p.id === id);
    if (person) {
      person.checked_in = newState;
      person.checked_in_at = newState ? new Date().toISOString() : null;
    }
    render();
  });

  searchEl.addEventListener('input', () => {
    query = searchEl.value;
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  function openAddModal() {
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <h2>Add walk-in attendee</h2>
          <label for="new-name">Full name</label>
          <input type="text" id="new-name" placeholder="e.g. Sara Amrani" autocomplete="off" />
          <label for="new-company">Company (optional)</label>
          <input type="text" id="new-company" placeholder="e.g. Green Berry Export" autocomplete="off" />
          <div class="modal-actions">
            <button class="cancel" id="cancel-add">Cancel</button>
            <button class="confirm" id="confirm-add">Add & check in</button>
          </div>
        </div>
      </div>
    `;
    const backdrop = document.getElementById('backdrop');
    const nameInput = document.getElementById('new-name');
    nameInput.focus();

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) modalRoot.innerHTML = '';
    });
    document.getElementById('cancel-add').addEventListener('click', () => {
      modalRoot.innerHTML = '';
    });
    document.getElementById('confirm-add').addEventListener('click', addWalkIn);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addWalkIn();
    });
  }

  async function addWalkIn() {
    const nameInput = document.getElementById('new-name');
    const companyInput = document.getElementById('new-company');
    const name = nameInput.value.trim();
    const company = companyInput.value.trim();

    if (!name) {
      nameInput.focus();
      return;
    }

    const confirmBtn = document.getElementById('confirm-add');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Adding…';

    const { data, error } = await supabase
      .from('attendance_people')
      .insert({
        name,
        company: company || null,
        is_walk_in: true,
        checked_in: true,
        checked_in_at: new Date().toISOString()
      })
      .select()
      .single();

    if (error) {
      showToast('Could not add attendee: ' + error.message);
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Add & check in';
      return;
    }

    people.push(data);
    modalRoot.innerHTML = '';
    showToast(`${name} added and checked in`);
    render();
  }

  openAddBtn.addEventListener('click', openAddModal);

  // Live sync across devices at the same event
  if (supabase) {
    supabase
      .channel('attendance_people_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance_people' }, () => {
        loadPeople();
      })
      .subscribe();

    loadPeople();
  }
</script>
</body>
</html>
