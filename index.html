<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Attendance" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Event Attendance — PACK ONE Launch 2026</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --border: #2a2f3a;
    --text: #e9ebf0;
    --text-dim: #9aa1ae;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --good: #34d399;
    --good-bg: rgba(52, 211, 153, 0.12);
    --warn: #fbbf24;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    height: 100%;
    /* prevent iOS text-size adjustment on rotate */
    -webkit-text-size-adjust: 100%;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    min-height: 100dvh;
    overscroll-behavior-y: contain;
  }

  button, input {
    font-family: inherit;
    touch-action: manipulation;
  }

  button {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding-left: calc(14px + var(--safe-left));
    padding-right: calc(14px + var(--safe-right));
    padding-bottom: calc(110px + var(--safe-bottom));
  }

  /* Sticky compact header: title, live counts, search, filters all stay
     visible while the (potentially long) attendee list scrolls beneath it. */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding-top: calc(14px + var(--safe-top));
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .topbar-row1 {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .brand h1 {
    font-size: clamp(18px, 5vw, 22px);
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.2;
  }

  .brand p {
    margin: 2px 0 0;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  .icon-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:active { background: var(--surface-2); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    min-width: 0;
  }

  .stat .num {
    font-size: clamp(18px, 5.5vw, 24px);
    font-weight: 700;
    line-height: 1.1;
  }

  .stat .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat.checked-in .num { color: var(--good); }

  .search-wrap { margin-bottom: 8px; }

  input[type="text"], input[type="search"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    /* 16px minimum keeps iOS Safari from auto-zooming into the field */
    font-size: 16px;
    outline: none;
    transition: border-color .15s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="text"]:focus, input[type="search"]:focus {
    border-color: var(--accent);
  }

  .filter-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }

  .filter-chips::-webkit-scrollbar { display: none; }

  .filter-chips button {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    cursor: pointer;
    font-weight: 500;
    min-height: 40px;
  }

  .filter-chips button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 12px;
    min-height: 60px;
    transition: border-color .15s ease, background .15s ease;
    cursor: pointer;
  }

  .row:active { background: var(--surface-2); }

  .row.checked-in {
    border-color: rgba(52, 211, 153, 0.35);
    background: var(--good-bg);
  }

  .row.checked-in:active { background: rgba(52, 211, 153, 0.2); }

  .row .info { min-width: 0; flex: 1; }

  .row .name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .company {
    font-size: 12.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .row .badge {
    font-size: 10.5px;
    color: var(--warn);
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .check-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-width: 100px;
    min-height: 40px;
    pointer-events: none; /* the whole row is the tap target */
    transition: all .15s ease;
  }

  .check-btn.done {
    background: var(--good);
    color: #06281c;
    border-color: var(--good);
  }

  .check-btn:disabled { opacity: 0.6; }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 14px;
  }

  .loading {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
  }

  /* Floating action button: the primary "someone just walked in" action,
     always reachable with a thumb regardless of scroll position. */
  .fab {
    position: fixed;
    right: calc(18px + var(--safe-right));
    bottom: calc(18px + var(--safe-bottom));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    font-size: 28px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(91, 140, 255, 0.45);
    z-index: 30;
  }

  .fab:active { filter: brightness(0.95); transform: scale(0.96); }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    padding-bottom: calc(18px + var(--safe-bottom));
    width: 100%;
    max-width: 380px;
    max-height: 88vh;
    overflow-y: auto;
  }

  .modal.wide {
    max-width: 520px;
    display: flex;
    flex-direction: column;
  }

  .modal h2 {
    margin: 0 0 14px;
    font-size: 17px;
  }

  /* On phones, modals dock to the bottom edge as a sheet: easier to reach
     one-handed than a centered dialog, and avoids the on-screen keyboard
     covering the confirm button. */
  @media (max-width: 640px) {
    .modal-backdrop { align-items: flex-end; padding: 0; }
    .modal, .modal.wide {
      max-width: 100%;
      width: 100%;
      border-radius: 18px 18px 0 0;
      max-height: 90vh;
    }
  }

  .admin-add-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .admin-add-row input { width: 100%; }

  .admin-add-row button {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    min-height: 46px;
  }

  .admin-add-row button:disabled { opacity: 0.6; cursor: wait; }

  .admin-list {
    margin-top: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 2px;
    max-height: 40vh;
  }

  .admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 10px;
  }

  .admin-row .info { min-width: 0; }

  .admin-row .name {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .admin-row .company {
    font-size: 11.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .delete-btn {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 36px;
  }

  .delete-btn:active { background: rgba(239, 68, 68, 0.12); }
  .delete-btn:disabled { opacity: 0.5; cursor: wait; }

  .modal label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 10px 0 5px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    position: sticky;
    bottom: 0;
    background: var(--surface);
    padding-top: 4px;
  }

  .modal-actions button {
    flex: 1;
    padding: 13px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
  }

  .modal-actions .cancel {
    background: transparent;
    color: var(--text-dim);
  }

  .modal-actions .confirm {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
  }

  .toast {
    position: fixed;
    bottom: calc(90px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    z-index: 60;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    max-width: calc(100vw - 32px);
    text-align: center;
  }

  .error-banner {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .error-banner code {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.85;
    word-break: break-all;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="brand">
        <h1>Event Attendance</h1>
        <p>PACK ONE — Launch 2026</p>
      </div>
      <button class="icon-btn" id="open-admin" aria-label="Manage attendees">⚙</button>
    </div>

    <div id="config-error"></div>

    <div class="stats">
      <div class="stat">
        <div class="num" id="stat-total">0</div>
        <div class="label">Registered</div>
      </div>
      <div class="stat checked-in">
        <div class="num" id="stat-checked">0</div>
        <div class="label">Checked in</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-remaining">0</div>
        <div class="label">Remaining</div>
      </div>
    </div>

    <div class="search-wrap">
      <input type="search" id="search" placeholder="Search by name or company…" autocomplete="off" enterkeyhint="search" />
    </div>

    <div class="filter-chips">
      <button data-filter="all" class="active">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="checked">Checked in</button>
    </div>
  </div>

  <div id="list" class="list">
    <div class="loading">Loading attendee list…</div>
  </div>
</div>

<button class="fab" id="open-add" aria-label="Add walk-in attendee">+</button>

<div id="modal-root"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://myjwzrgujrjdeytzkvhf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_pZWc1olk9-6jCRP0XnV2qw_upR7F8gP';

  const configErrorEl = document.getElementById('config-error');
  let supabase = null;

  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    configErrorEl.innerHTML = `<div class="error-banner">Could not connect to Supabase.<code>${escapeHtml(String(e))}</code></div>`;
  }

  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const statTotal = document.getElementById('stat-total');
  const statChecked = document.getElementById('stat-checked');
  const statRemaining = document.getElementById('stat-remaining');
  const filterBtns = document.querySelectorAll('.filter-chips button');
  const openAddBtn = document.getElementById('open-add');
  const openAdminBtn = document.getElementById('open-admin');
  const modalRoot = document.getElementById('modal-root');

  let people = [];
  let filter = 'all';
  let query = '';

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  async function loadPeople() {
    const { data, error } = await supabase
      .from('attendance_people')
      .select('*')
      .order('company', { ascending: true })
      .order('name', { ascending: true });

    if (error) {
      listEl.innerHTML = `<div class="error-banner">Failed to load attendees.<code>${escapeHtml(error.message)}</code></div>`;
      return;
    }
    people = data || [];
    render();
  }

  function render() {
    const total = people.length;
    const checked = people.filter(p => p.checked_in).length;
    statTotal.textContent = total;
    statChecked.textContent = checked;
    statRemaining.textContent = total - checked;

    const q = query.trim().toLowerCase();
    let filtered = people.filter(p => {
      if (filter === 'pending' && p.checked_in) return false;
      if (filter === 'checked' && !p.checked_in) return false;
      if (q) {
        const hay = `${p.name} ${p.company || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty">No matching attendees.</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(p => `
      <div class="row ${p.checked_in ? 'checked-in' : ''}" data-id="${p.id}" data-state="${p.checked_in ? '1' : '0'}">
        <div class="info">
          <div class="name">${escapeHtml(p.name)}${p.is_walk_in ? '<span class="badge">walk-in</span>' : ''}</div>
          <div class="company">${escapeHtml(p.company || '')}</div>
        </div>
        <button class="check-btn ${p.checked_in ? 'done' : ''}" tabindex="-1">
          ${p.checked_in ? '✓ Checked in' : 'Check in'}
        </button>
      </div>
    `).join('');
  }

  // The entire row is the tap target (not just the small button), so it's
  // easy to hit one-handed on a phone while scrolling a long list.
  listEl.addEventListener('click', async (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const id = row.dataset.id;
    const btn = row.querySelector('.check-btn');
    const currentlyChecked = row.dataset.state === '1';
    if (btn.disabled) return;
    btn.disabled = true;

    const newState = !currentlyChecked;
    const { error } = await supabase
      .from('attendance_people')
      .update({
        checked_in: newState,
        checked_in_at: newState ? new Date().toISOString() : null
      })
      .eq('id', id);

    if (error) {
      showToast('Update failed: ' + error.message);
      btn.disabled = false;
      return;
    }

    const person = people.find(p => p.id === id);
    if (person) {
      person.checked_in = newState;
      person.checked_in_at = newState ? new Date().toISOString() : null;
    }
    render();
  });

  searchEl.addEventListener('input', () => {
    query = searchEl.value;
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  function openAddModal() {
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <h2>Add walk-in attendee</h2>
          <label for="new-name">Full name</label>
          <input type="text" id="new-name" placeholder="e.g. Sara Amrani" autocomplete="off" enterkeyhint="next" />
          <label for="new-company">Company (optional)</label>
          <input type="text" id="new-company" placeholder="e.g. Green Berry Export" autocomplete="off" enterkeyhint="done" />
          <div class="modal-actions">
            <button class="cancel" id="cancel-add">Cancel</button>
            <button class="confirm" id="confirm-add">Add & check in</button>
          </div>
        </div>
      </div>
    `;
    const backdrop = document.getElementById('backdrop');
    const nameInput = document.getElementById('new-name');
    nameInput.focus();

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) modalRoot.innerHTML = '';
    });
    document.getElementById('cancel-add').addEventListener('click', () => {
      modalRoot.innerHTML = '';
    });
    document.getElementById('confirm-add').addEventListener('click', addWalkIn);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addWalkIn();
    });
  }

  async function addWalkIn() {
    const nameInput = document.getElementById('new-name');
    const companyInput = document.getElementById('new-company');
    const name = nameInput.value.trim();
    const company = companyInput.value.trim();

    if (!name) {
      nameInput.focus();
      return;
    }

    const confirmBtn = document.getElementById('confirm-add');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Adding…';

    const { data, error } = await supabase
      .from('attendance_people')
      .insert({
        name,
        company: company || null,
        is_walk_in: true,
        checked_in: true,
        checked_in_at: new Date().toISOString()
      })
      .select()
      .single();

    if (error) {
      showToast('Could not add attendee: ' + error.message);
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Add & check in';
      return;
    }

    people.push(data);
    modalRoot.innerHTML = '';
    showToast(`${name} added and checked in`);
    render();
  }

  openAddBtn.addEventListener('click', openAddModal);

  function renderAdminList(container, filterText) {
    const q = (filterText || '').trim().toLowerCase();
    const rows = people
      .filter(p => !q || `${p.name} ${p.company || ''}`.toLowerCase().includes(q))
      .map(p => `
        <div class="admin-row" data-id="${p.id}">
          <div class="info">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="company">${escapeHtml(p.company || '')}</div>
          </div>
          <button class="delete-btn" data-id="${p.id}" data-confirm="0">Delete</button>
        </div>
      `).join('');
    container.innerHTML = rows || `<div class="empty">No attendees match.</div>`;
  }

  function openAdminModal() {
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal wide">
          <h2>Manage attendees</h2>
          <div class="admin-add-row">
            <input type="text" id="admin-new-name" placeholder="Full name" autocomplete="off" enterkeyhint="next" />
            <input type="text" id="admin-new-company" placeholder="Company (optional)" autocomplete="off" enterkeyhint="done" />
            <button id="admin-confirm-add">Add attendee</button>
          </div>
          <label for="admin-search" style="margin-top:14px;">Search existing attendees</label>
          <input type="search" id="admin-search" placeholder="Search by name or company…" autocomplete="off" enterkeyhint="search" />
          <div class="admin-list" id="admin-list"></div>
          <div class="modal-actions">
            <button class="cancel" id="close-admin">Close</button>
          </div>
        </div>
      </div>
    `;

    const backdrop = document.getElementById('backdrop');
    const nameInput = document.getElementById('admin-new-name');
    const companyInput = document.getElementById('admin-new-company');
    const addBtn = document.getElementById('admin-confirm-add');
    const searchInput = document.getElementById('admin-search');
    const listContainer = document.getElementById('admin-list');

    renderAdminList(listContainer, '');
    nameInput.focus();

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) modalRoot.innerHTML = '';
    });
    document.getElementById('close-admin').addEventListener('click', () => {
      modalRoot.innerHTML = '';
    });

    searchInput.addEventListener('input', () => {
      renderAdminList(listContainer, searchInput.value);
    });

    async function addAttendee() {
      const name = nameInput.value.trim();
      const company = companyInput.value.trim();
      if (!name) {
        nameInput.focus();
        return;
      }
      addBtn.disabled = true;
      addBtn.textContent = 'Adding…';

      const { data, error } = await supabase
        .from('attendance_people')
        .insert({
          name,
          company: company || null,
          is_walk_in: false,
          checked_in: false,
          checked_in_at: null
        })
        .select()
        .single();

      addBtn.disabled = false;
      addBtn.textContent = 'Add attendee';

      if (error) {
        showToast('Could not add attendee: ' + error.message);
        return;
      }

      people.push(data);
      nameInput.value = '';
      companyInput.value = '';
      nameInput.focus();
      renderAdminList(listContainer, searchInput.value);
      showToast(`${name} added to the attendee list`);
      render();
    }

    addBtn.addEventListener('click', addAttendee);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addAttendee(); });
    companyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addAttendee(); });

    listContainer.addEventListener('click', async (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.dataset.id;
      const person = people.find(p => p.id === id);
      if (!person) return;

      if (btn.dataset.confirm !== '1') {
        listContainer.querySelectorAll('.delete-btn').forEach(b => {
          b.dataset.confirm = '0';
          b.textContent = 'Delete';
        });
        btn.dataset.confirm = '1';
        btn.textContent = 'Confirm?';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Removing…';

      const { error } = await supabase
        .from('attendance_people')
        .delete()
        .eq('id', id);

      if (error) {
        showToast('Could not remove attendee: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Delete';
        return;
      }

      people = people.filter(p => p.id !== id);
      renderAdminList(listContainer, searchInput.value);
      showToast(`${person.name} removed`);
      render();
    });
  }

  openAdminBtn.addEventListener('click', openAdminModal);

  // Live sync across devices at the same event
  if (supabase) {
    supabase
      .channel('attendance_people_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance_people' }, () => {
        loadPeople();
      })
      .subscribe();

    loadPeople();
  }
</script>
</body>
</html>
